services:
  n8n:
    build: .
    container_name: n8n-recettes
    restart: unless-stopped          # redémarre tout seul quand Docker Desktop démarre
    init: false                      # tini est déjà dans l'image
    ports:
      - "127.0.0.1:5678:5678"        # accessible uniquement depuis ton PC
    env_file: .env                   # tes clés (jamais sur GitHub)
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      # n8n v2 désactive "Execute Command" par défaut : on le réactive (nécessaire pour yt-dlp)
      - NODES_EXCLUDE=[]
      # Dossier autorisé pour lire/écrire des fichiers
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Autorise {{ $env.XXX }} dans les nœuds (les clés restent dans .env)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      # Ménage automatique de l'historique (7 jours)
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n     # comptes, workflows, historique
      - ./files:/files               # cookies.txt + fichiers audio temporaires

volumes:
  n8n_data:
